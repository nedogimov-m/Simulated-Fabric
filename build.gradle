plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

version = providers.gradleProperty('mod_version').get()

// Resolve the already built local ports. Never rebuild the sibling Create project.
def artifactNames = ['create', 'companion', 'veil', 'sable']
def portingCommand = { String command ->
    def args = ['python3', rootProject.file('tools/porting.py').absolutePath, command]
    artifactNames.each { name ->
        def override = providers.gradleProperty("${name}_jar")
        if (override.isPresent()) {
            args.addAll(['--artifact', "${name}=${rootProject.file(override.get()).absolutePath}"])
        }
    }
    args
}

ext.portArtifactPaths = providers.exec {
    commandLine(portingCommand('paths'))
}.standardOutput.asText.map { output ->
    def paths = output.readLines().findAll { !it.isBlank() }
    if (paths.size() != artifactNames.size()) {
        throw new GradleException('tools/porting.py paths must return Create, Companion, Veil and Sable paths in that order.')
    }
    artifactNames.withIndex().collectEntries { name, index ->
        [(name): rootProject.file(paths[index])]
    }
}

tasks.register('auditPort', Exec) {
    group = 'verification'
    description = 'Report source migration scope and the state of genuine local dependencies.'
    commandLine('python3', rootProject.file('tools/porting.py').absolutePath, 'audit')
}

tasks.register('verifyPortPrerequisites', Exec) {
    group = 'verification'
    description = 'Reject missing or incompatible genuine Fabric 26.3 dependency artifacts before compilation.'
    commandLine(portingCommand('verify-deps'))
}

tasks.register('prepareFabricCompileApis', Exec) {
    group = 'build setup'
    description = 'Prepare genuine optional Fabric API class descriptors for compilation.'
    inputs.files(rootProject.file('../sable/tools/prepare_fabric_compile_apis.py'), rootProject.file('../sable/tools/fabric-compile-apis.json'))
    outputs.files(rootProject.file('../sable/build/compile-api/computercraft-api.jar'), rootProject.file('../sable/build/compile-api/exposure-api.jar'), rootProject.file('../sable/build/compile-api/shouldersurfing-api.jar'))
    commandLine('python3', rootProject.file('../sable/tools/prepare_fabric_compile_apis.py').absolutePath)
}

tasks.register('resolveOptionalCompileApis', Exec) {
    group = 'build setup'
    description = 'Resolve genuine optional 26.3 API bytes using the recorded URLs and SHA256 pins.'
    commandLine('python3', rootProject.file('tools/resolve_optional_apis.py').absolutePath)
}

['simulated', 'aeronautics', 'offroad'].each { modName ->
    configure(project(":${modName}:fabric")) {
        def modProps = new Properties()
        rootProject.file("${modName}/gradle.properties").withInputStream { modProps.load(it) }
        modProps.each { key, value -> ext.set(key.toString(), value) }
        version = rootProject.version
        group = modProps.getProperty('group')
        description = modProps.getProperty('description')
    }
}

tasks.named('assemble') {
    dependsOn('bundleJar')
}

// One installable project: keep each component's Fabric identity and lifecycle
// intact while shipping Simulated, Aeronautics and Offroad in one bundle.
tasks.register('bundleJar', Jar) {
    group = 'build'
    description = 'Package the three Fabric components in one installable Aeronautics bundle.'
    archiveBaseName = 'aeronautics-bundle-fabric-26.3'
    archiveVersion = rootProject.version.toString()
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    def components = ['simulated', 'aeronautics', 'offroad']
    dependsOn(components.collect { ":${it}:fabric:jar" })
    from(providers.provider {
        components.collect { project(":${it}:fabric").tasks.named('jar', Jar).get().archiveFile.get().asFile }
    }) { into 'META-INF/jars' }
    from('aeronautics-bundled/fabric/src/main/resources/fabric.mod.json') {
        expand(version: rootProject.version.toString())
    }
    from('LICENSE.md')
}
tasks.named('check') {
    dependsOn(':simulated:fabric:check', ':aeronautics:fabric:check', ':offroad:fabric:check')
}
